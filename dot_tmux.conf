set -g mouse on
setw -g mode-keys vi

# Ctrl-a prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind S choose-session

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Easier pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Status bar
set -g status on
set -g status-position top
set -g status-style "bg=default,fg=#8b949e"
set -g status-justify left

# Left: session name
set -g status-left-length 30
set -g status-left '#[fg=#56d4dd,bold] #S #[fg=#30363d]│ '

# Center area: window list, left-aligned
set -g window-status-format ' #[fg=#8b949e]#I:#W '
set -g window-status-current-format ' #[fg=#56d4dd,bold]▸ #I:#W '

set -g window-status-separator ''
set -g window-status-style "bg=default,fg=#8b949e"
set -g window-status-current-style "bg=default,fg=#56d4dd,bold"

# Right: date and time
set -g status-right-length 40
set -g status-right '#[fg=#30363d]│ #[fg=#8b949e]%a %b %d  #[fg=#56d4dd,bold]%H:%M '

# Refresh interval
set -g status-interval 5

# Pane borders
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#56d4dd"

# Messages and prompts
set -g message-style "bg=#161b22,fg=#c9d1d9"
set -g message-command-style "bg=#161b22,fg=#56d4dd"
